<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" fill="none">
  <rect width="200" height="150" rx="12" fill="#F4F8F1"/>
  <!-- Husk leaves (back) -->
  <path d="M70 125 C45 95 40 45 65 20 C68 40 75 75 95 105 Z" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>
  <path d="M125 125 C150 95 155 45 130 20 C128 40 120 75 102 105 Z" fill="#A5D6A7" stroke="#66BB6A" stroke-width="2"/>

  <!-- Corn ear body (Andean choclo with pale creamy white-yellow kernels) -->
  <g transform="translate(75, 25)">
    <path d="M12 95 C6 60 10 20 25 5 C40 20 44 60 38 95 Z" fill="#FFF9C4" stroke="#E6D28A" stroke-width="2.5"/>
    <!-- Kernels rows (choclo gigante del Cusco style) -->
    <!-- Row 1 -->
    <ellipse cx="25" cy="15" rx="5" ry="4" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 2 -->
    <ellipse cx="19" cy="25" rx="5.5" ry="4.5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="31" cy="25" rx="5.5" ry="4.5" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 3 -->
    <ellipse cx="16" cy="36" rx="6" ry="5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="25" cy="36" rx="6" ry="5" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="34" cy="36" rx="6" ry="5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 4 -->
    <ellipse cx="14" cy="48" rx="6.5" ry="5.5" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="25" cy="48" rx="6.5" ry="5.5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="36" cy="48" rx="6.5" ry="5.5" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 5 -->
    <ellipse cx="13" cy="62" rx="7" ry="6" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="25" cy="62" rx="7" ry="6" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="37" cy="62" rx="7" ry="6" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 6 -->
    <ellipse cx="14" cy="76" rx="7" ry="6" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="25" cy="76" rx="7" ry="6" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="36" cy="76" rx="7" ry="6" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <!-- Row 7 -->
    <ellipse cx="16" cy="89" rx="6.5" ry="5.5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="25" cy="89" rx="6.5" ry="5.5" fill="#FFF9C4" stroke="#E6D28A" stroke-width="1.2"/>
    <ellipse cx="34" cy="89" rx="6.5" ry="5.5" fill="#FFFDE7" stroke="#E6D28A" stroke-width="1.2"/>
  </g>

  <!-- Front husk curls -->
  <path d="M68 128 C65 100 70 70 58 55 C65 75 75 95 85 130 Z" fill="#66BB6A" stroke="#388E3C" stroke-width="2"/>
  <path d="M128 128 C132 100 126 70 138 55 C132 75 122 95 112 130 Z" fill="#81C784" stroke="#4CAF50" stroke-width="2"/>

  <!-- Corn silk (barba de choclo) -->
  <path d="M96 24 C90 10 93 4 88 1" stroke="#8D6E63" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M100 23 C102 12 98 6 102 2" stroke="#A1887F" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M104 25 C108 14 112 7 109 0" stroke="#8D6E63" stroke-width="1.5" stroke-linecap="round"/>
</svg>
