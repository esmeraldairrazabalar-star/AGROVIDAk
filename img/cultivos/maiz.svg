  <!-- Front husk leaves -->
  <path d="M60 135 C58 105 65 75 52 50 C62 72 75 95 86 135 Z" fill="#558B2F" stroke="#33691E" stroke-width="2"/>
  <path d="M138 135 C140 105 133 75 146 50 C136 72 123 95 112 135 Z" fill="#689F38" stroke="#33691E" stroke-width="2"/>
  
  <!-- Corn silk strands -->
  <path d="M98 18 C94 8 96 3 92 0" stroke="#795548" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M102 18 C105 10 103 4 106 1" stroke="#8D6E63" stroke-width="1.8" stroke-linecap="round"/>
