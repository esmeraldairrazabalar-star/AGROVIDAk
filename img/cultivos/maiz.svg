    <!-- Row 3 -->
    <ellipse cx="16" cy="35" rx="5.5" ry="4.5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="26" cy="35" rx="5.5" ry="4.5" fill="#FFB300" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="36" cy="35" rx="5.5" ry="4.5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <!-- Row 4 -->
    <ellipse cx="14" cy="48" rx="6" ry="5" fill="#FFCA28" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="26" cy="48" rx="6" ry="5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="38" cy="48" rx="6" ry="5" fill="#FFB300" stroke="#F57F17" stroke-width="1"/>
    <!-- Row 5 -->
    <ellipse cx="13" cy="62" rx="6.5" ry="5.5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="26" cy="62" rx="6.5" ry="5.5" fill="#FFCA28" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="39" cy="62" rx="6.5" ry="5.5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <!-- Row 6 -->
    <ellipse cx="14" cy="76" rx="6.5" ry="5.5" fill="#FFB300" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="26" cy="76" rx="6.5" ry="5.5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
    <ellipse cx="38" cy="76" rx="6.5" ry="5.5" fill="#FFCA28" stroke="#F57F17" stroke-width="1"/>
    <!-- Row 7 -->
    <ellipse cx="16" cy="89" rx="6" ry="5" fill="#FFEE58" stroke="#F57F17" stroke-width="1"/>
