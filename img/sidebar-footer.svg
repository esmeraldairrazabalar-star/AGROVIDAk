<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none">
  <rect width="220" height="90" rx="10" fill="#143E28"/>
  <!-- Field hills in sidebar footer -->
  <path d="M0 65 Q60 50 120 58 T220 52 L220 90 L0 90 Z" fill="#1B4F33"/>
  <path d="M0 72 Q70 62 140 68 T220 65 L220 90 L0 90 Z" fill="#246441"/>

  <!-- Mini Tractor -->
  <g transform="translate(145, 38) scale(0.65)">
    <!-- Cabin -->
    <rect x="25" y="10" width="22" height="25" rx="3" fill="#E65100"/>
    <rect x="28" y="13" width="16" height="12" rx="2" fill="#BBDEFB"/>
    <!-- Hood / Engine -->
    <path d="M47 22 L65 22 L67 35 L47 35 Z" fill="#EF6C00"/>
    <!-- Exhaust -->
    <rect x="60" y="8" width="3" height="14" fill="#424242"/>
    <circle cx="61.5" cy="7" r="2.5" fill="#757575"/>
    <!-- Big Rear Wheel -->
    <circle cx="28" cy="38" r="14" fill="#212121"/>
    <circle cx="28" cy="38" r="8" fill="#BDBDBD"/>
    <circle cx="28" cy="38" r="4" fill="#E65100"/>
    <!-- Small Front Wheel -->
    <circle cx="62" cy="42" r="9" fill="#212121"/>
    <circle cx="62" cy="42" r="5" fill="#BDBDBD"/>
    <circle cx="62" cy="42" r="2.5" fill="#E65100"/>
  </g>

  <!-- Logo and text in footer card -->
  <g transform="translate(15, 20)">
    <path d="M6 18C6 11 12 6 19 6C19 12 14 19 7 19Z" fill="#66BB6A"/>
    <path d="M13 19C13 13 18 8 24 9C23 15 19 20 13 20Z" fill="#A5D6A7"/>
    <text x="30" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">AgroVida</text>
    <text x="30" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#A5D6A7">Tecnología al servicio</text>
    <text x="30" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#A5D6A7">del campo 🌿</text>
  </g>
</svg>
